[project]
name = "beyond-retrieval"
version = "0.1.0"
description = "Experiment harness for Beyond Retrieval: hypothesis-driven investigation on public security logs."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = ["pydantic>=2.6"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
beyond-retrieval = "beyond_retrieval.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
